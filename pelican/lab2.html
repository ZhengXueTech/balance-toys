<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鵜鶘第二款</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* 版面和老鷹組裝圖同一套：左側 3D 工作檯，右側（手機在下方）步驟面板 */
:root{
  --bg:#dce8ef; --bg2:#c3d6e1; --panel:#f6f8f9; --ink:#1c2a31; --muted:#5a6a72; --line:#cfd8dd;
  --accent:#cf3348; --accent-ink:#ffffff; --wood:#b88a52; --ok:#2c8a57; --chip:#ebeff1; --fish:#2f7fb5; --gift:#c2475a;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b1f; --bg2:#0d1215; --panel:#1b2429; --ink:#e7edf0; --muted:#9aabb3; --line:#2c3a41;
  --accent:#ec5468; --accent-ink:#ffffff; --wood:#d4a868; --ok:#4cc184; --chip:#243037; --fish:#5fb0e6; --gift:#ec7488; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1f; --bg2:#0d1215; --panel:#1b2429; --ink:#e7edf0; --muted:#9aabb3; --line:#2c3a41;
  --accent:#ec5468; --accent-ink:#ffffff; --wood:#d4a868; --ok:#4cc184; --chip:#243037; --fish:#5fb0e6; --gift:#ec7488; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 40% 30%,var(--bg) 0%,var(--bg2) 100%);overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.hint{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:12px;font:12px/1.4 var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:5px 10px;border-radius:6px;pointer-events:none}
.ver{position:absolute;right:12px;top:10px;font:12px var(--f-mono);color:var(--muted);letter-spacing:.08em;pointer-events:none}
.tag{position:absolute;transform:translate(10px,-50%);font:600 12px var(--f-body);padding:2px 7px;border-radius:4px;color:#fff;pointer-events:none;white-space:nowrap}
.tag.pv{background:var(--ok)} .tag.cm{background:var(--accent)}
.nt{position:absolute;transform:translate(-50%,-135%);font:700 13px var(--f-mono);min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.nt.fish{background:var(--fish);border-color:var(--fish);color:#fff}.nt.gift{background:var(--gift);border-color:var(--gift);color:#fff}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-block:20px 16px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));gap:16px;overflow:auto}
.eyebrow{font:12px var(--f-mono);color:var(--accent);letter-spacing:.12em}
h1{font:700 30px/1.15 var(--f-display);margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.seg button{font:500 13px var(--f-body);padding:6px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.kind{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 8px 0 0;vertical-align:top}
.kind a{font:500 13px var(--f-body);padding:6px 14px;color:var(--muted);text-decoration:none}
.kind a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
#dots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#dots button{font:15px var(--f-mono);aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:6px;cursor:pointer}
#dots button.done{color:var(--ink);border-color:var(--wood)}
#dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{display:flex;flex-direction:column;gap:10px;flex:1}
.num{font:13px var(--f-mono);color:var(--muted);letter-spacing:.1em}
h2{font:700 24px/1.25 var(--f-display);margin:0;text-wrap:balance}
#txt{margin:0;font-size:16px;line-height:1.75;max-width:60ch}
#txt.elem{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:13px var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chips button b{font:12px var(--f-mono);color:var(--accent);margin-left:4px}
.extra{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--f-body);padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.sm{font-size:13px;padding:7px 10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
nav.steps{display:grid;grid-template-columns:1fr auto 1.4fr;gap:8px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}
.lab{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.lab-h{font:700 15px var(--f-display)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.slot>span{font:12px var(--f-mono);color:var(--muted);text-align:center}
.slot button{font:600 13px var(--f-body);height:30px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;cursor:pointer}
.slot button[aria-pressed="true"][data-v=""]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.slot button[aria-pressed="true"][data-v="fish"]{background:var(--fish);color:#fff;border-color:var(--fish)}
.slot button[aria-pressed="true"][data-v="gift"]{background:var(--gift);color:#fff;border-color:var(--gift)}
.slot button:disabled{opacity:.35;cursor:default}
.row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.8em;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.row input{width:100%;accent-color:var(--accent)}
.row output{font:13px var(--f-mono);color:var(--ink);text-align:right}
.tip{font-size:12.5px;color:var(--muted);line-height:1.6}
.read{font:13px/1.6 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.read b{font-weight:400;color:var(--accent)}
.state{display:inline-block;font:700 13px var(--f-body);padding:2px 10px;border-radius:999px;background:var(--ok);color:#fff;margin-bottom:4px}
.state.warn{background:#c98a1b}.state.bad{background:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  #panel{border-left:0;border-top:1px solid var(--line);max-height:50vh;max-height:50dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;gap:12px}
  h1{font-size:22px} .note,.sub{display:none} .seg{margin-top:8px} h2{font-size:20px}
  #txt{font-size:15px} #txt.elem{font-size:16px}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="home-link-css">.home-link{display:inline-flex;align-items:center;gap:4px;font:600 13px "Noto Sans TC",system-ui,sans-serif;color:inherit;opacity:.72;text-decoration:none;margin:0 0 6px;padding:4px 10px 4px 8px;border:1px solid currentColor;border-radius:999px;pointer-events:auto;width:max-content}.home-link:hover,.home-link:focus-visible{opacity:1}.home-link[hidden]{display:none!important}</style>

<div id="app">
  <div id="stage">
    <div class="ver">PELICAN 2 v1.0</div>
    <div class="tag pv" id="tagPv" hidden>支點</div>
    <div class="tag cm" id="tagCm" hidden>重心</div>
    <button class="nt" id="nt0" hidden aria-label="第 1 格">1</button><button class="nt" id="nt1" hidden aria-label="第 2 格">2</button><button class="nt" id="nt2" hidden aria-label="第 3 格">3</button><button class="nt" id="nt3" hidden aria-label="第 4 格">4</button>
    <div class="hint">拖曳旋轉 · 滾輪或雙指縮放 · ← → 換步驟</div>
  </div>
  <aside id="panel">
    <header>
      <a class="home-link" href="../index.html" hidden aria-label="回平衡玩具世界首頁">← 平衡玩具首頁</a>
    <div class="eyebrow">雷切木作 · 3mm 板 · 31 片 · 30×20 cm</div>
      <h1>鵜鶘第二款：餵魚平衡</h1>
      <div class="sub">支點在下巴，張開的嘴有 4 個格子。H 形魚和禮物放上去，看鵜鶘怎麼動（重心依雷切檔面積計算）</div>
      <nav class="kind" id="kind" aria-label="款式" hidden><a href="lab.html">第一款</a><a href="lab2.html" aria-current="page">第二款</a></nav>
      <div class="seg" role="group" aria-label="說明程度">
        <button id="lvE" aria-pressed="true">國小版</button><button id="lvJ" aria-pressed="false">國中版</button>
      </div>
    </header>
    <div id="dots" aria-label="步驟"></div>
    <section class="card">
      <div class="num" id="num"></div>
      <h2 id="ttl"></h2>
      <p id="txt"></p>
      <div class="chips" id="chips"></div>
      <div class="extra" id="extra" hidden>
        <button class="btn" id="push">輕推一下</button>
        <button class="btn" id="com" aria-pressed="false">顯示重心</button>
      </div>
      <div class="lab" id="lab" hidden>
        <div class="lab-h">餵魚實驗：1～4 號格放什麼？</div>
        <div class="slots" id="slots"></div>
        <div class="tip" id="stock"></div>
        <label class="row" for="wA"><span>大翅膀</span><input type="range" id="wA" min="25" max="95" step="1" value="59"><output id="wAV">59°</output></label>
        <label class="row" for="wB"><span>小翅膀</span><input type="range" id="wB" min="25" max="95" step="1" value="59"><output id="wBV">59°</output></label>
        <div class="presets"><button class="btn sm" id="wClose">翅膀收合（兩片 59°）</button><button class="btn sm" id="wOpen">翅膀攤開（小 35°／大 69°）</button></div>
        <div class="tip" id="tip"></div>
        <div class="read">
          <div class="state" id="state">穩定平衡</div>
          <div id="read0"></div>
          <div id="read1"></div>
          <div id="read2"></div>
        </div>
        <div class="presets">
          <button class="btn sm" data-p="0,1,0,1">原設計 2＋4</button>
          <button class="btn sm" data-p="1,1,1,0">1＋2＋3</button>
          <button class="btn sm" data-p="1,2,2,1">全部掛滿</button>
          <button class="btn sm" data-p="0,0,0,0">清空</button>
        </div>
      </div>
    </section>
    <nav class="steps">
      <button class="btn" id="prev">上一步</button>
      <button class="btn" id="again" title="重播這一步">重播</button>
      <button class="btn pri" id="next">下一步</button>
    </nav>
    <div class="note">點零件名稱可在畫面中找到它；實驗步驟也可以直接點嘴巴上的 1～4 號圈圈。禮物片和魚片面積一樣，所以一樣重：鵜鶘也能當「送子鳥」叼禮物（傳說裡的送子鳥其實是白鸛）。<br>CC BY-NC-SA 4.0 · 何政學／學思創客 XUESI MAKER</div>
  </aside>
</div>

const S=G.shapes;
function wingPos(sh,off,ang){const a=(180+ang)*D,cx=sh.c[0]-off,cy=sh.c[1];return[SH[0]+cx*Math.cos(a)-cy*Math.sin(a),SH[1]+cx*Math.sin(a)+cy*Math.cos(a)]}
function itemCom(kind){const P=S[kind],B=S.bar,a=2*P.area+B.area;return{a,y:2*P.area*P.c[0]/a,z:(2*P.area*(G.ZF+P.c[1])+B.area*(G.ZC+B.c[1]))/a}}
function com(slots,wA,wB){
  const it=[[S.main.area,S.main.c[0],S.main.c[1]]];
  [[S.wingA,G.WAo,wA],[S.wingB,G.WBo,wB]].forEach(([sh,off,ang])=>{const[y,z]=wingPos(sh,off,ang);it.push([sh.area*2,y,z])});
  it.push([S.pin.area+S.washer.area,SH[0],SH[1]]);
  slots.forEach((k,i)=>{if(!k)return;const c=itemCom(k);it.push([c.a,NY[i]+c.y,c.z])});
  let m=0,y=0,z=0;it.forEach(([a,yy,zz])=>{m+=a;y+=a*yy;z+=a*zz});return{m,y:y/m,z:z/m}}
let C={},eqT=0,cur=0,stuck=false,fallen=false;
function updateEq(){
  const slots=step>=7?cfg.slot:[null,null,null,null];
  C=com(slots,cfg.wA,cfg.wB);
  fallen=C.z>=0;                                   // 重心跑到支點上方：不穩定
  eqT=Math.atan2(C.y,-C.z);stuck=Math.abs(eqT)>LIM*D;

}

const tmpM=new M4(),tA=new V3(),tB=new V3(),qA=new Q(),qB=new Q(),sc=new V3(),pos=new V3(),qq=new Q(),wp=new V3(),nq=new M4();
let lastDt=0;
function frames(){
  if(step<3)FR.pillar.compose(HOVER,QI,one);
  else if(step===3){pos.lerpVectors(HOVER,STAND,ease(clamp(stepP/.8)));FR.pillar.compose(pos,QI,one)}
  else FR.pillar.compose(STAND,QI,one);
  // 鳥：步驟 6 在手上（支柱正上方）組翅膀，步驟 7 放下去
  let ang=0;
  if(step<6){FR.bird.compose(BENCH,QI,one);cur=0}
  else{
    const k=step===6?ease(clamp(stepP/.45)):1;pos.lerpVectors(BENCH,PIVOT,k);
    if(k<1)cur=0;else cur+=(eqT-cur)*Math.min(1,lastDt*2.2);
    const dec=Math.exp(-.6*swingT);
    ang=clamp(cur+(swingOn?swingA*dec*Math.sin(3.4*swingT):0),-LIM*D,LIM*D);
    qq.setFromAxisAngle(new V3(1,0,0),ang);FR.bird.compose(pos,qq,one);
  }
  // 翅膀依實驗角度擺
  WINGS.forEach(p=>p.local.copy(M(p.wx,SH[1],SH[0],QV)).multiply(new M4().makeRotationZ((180+(p.big?cfg.wA:cfg.wB))*D)).multiply(new M4().makeTranslation(-p.off,0,0)));
  // H 魚：放進格子的跟著鳥，其他站在盤子上（x=-9 一排）
  const used=step>=7?cfg.slot:[null,null,null,null], at=[-1,-1,-1,-1,-1,-1], pool={fish:[0,1,2,3],gift:[4,5]};
  used.forEach((k,s)=>{if(k&&pool[k].length)at[pool[k].shift()]=s});
  ITEMS.forEach((it,i)=>{it.slot=at[i];
    if(at[i]>=0)FR.h[i].multiplyMatrices(FR.bird,M(0,G.ZC,NY[at[i]]));
    else FR.h[i].compose(new V3(-9,2.0-(G.ZF-G.ZC),-9+i*4.6),QI,one)});
}
function target(p){
  if(!p.local){p.flat.decompose(p.tp,p.tq,sc);return [step>0,false]}
  tmpM.multiplyMatrices(frameOf(p),p.local);
