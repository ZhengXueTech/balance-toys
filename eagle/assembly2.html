<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老鷹平衡鳥第二款</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
/* 版面：左側 3D 工作檯，右側（手機在下方）步驟面板。配色取自雷切軟體：淺灰藍檯面、木料、雷射紅標籤 */
:root{
  --bg:#dce8ef; --bg2:#c3d6e1; --panel:#f6f8f9; --ink:#1c2a31; --muted:#5a6a72; --line:#cfd8dd;
  --accent:#cf3348; --accent-ink:#ffffff; --wood:#b88a52; --ok:#2c8a57; --chip:#ebeff1;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b1f; --bg2:#0d1215; --panel:#1b2429; --ink:#e7edf0; --muted:#9aabb3; --line:#2c3a41;
  --accent:#ec5468; --accent-ink:#ffffff; --wood:#d4a868; --ok:#4cc184; --chip:#243037; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1f; --bg2:#0d1215; --panel:#1b2429; --ink:#e7edf0; --muted:#9aabb3; --line:#2c3a41;
  --accent:#ec5468; --accent-ink:#ffffff; --wood:#d4a868; --ok:#4cc184; --chip:#243037; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px)}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 40% 30%,var(--bg) 0%,var(--bg2) 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.hint{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:12px;font:12px/1.4 var(--f-body);color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:5px 10px;border-radius:6px;pointer-events:none}
.ver{position:absolute;right:12px;top:10px;font:12px var(--f-mono);color:var(--muted);letter-spacing:.08em;pointer-events:none}
.tag{position:absolute;transform:translate(10px,-50%);font:600 12px var(--f-body);padding:2px 7px;border-radius:4px;color:#fff;pointer-events:none;white-space:nowrap}
.tag.pv{background:var(--ok)} .tag.cm{background:var(--accent)}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-block:20px 16px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));gap:16px;overflow:auto}
.eyebrow{font:12px var(--f-mono);color:var(--accent);letter-spacing:.12em}
h1{font:700 30px/1.15 var(--f-display);margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.seg button{font:500 13px var(--f-body);padding:6px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#dots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#dots button{font:15px var(--f-mono);aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:6px;cursor:pointer}
#dots button.done{color:var(--ink);border-color:var(--wood)}
#dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{display:flex;flex-direction:column;gap:10px;flex:1}
.num{font:13px var(--f-mono);color:var(--muted);letter-spacing:.1em}
h2{font:700 24px/1.25 var(--f-display);margin:0;text-wrap:balance}
#txt{margin:0;font-size:16px;line-height:1.75;max-width:60ch}
#txt.elem{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:13px var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chips button b{font:12px var(--f-mono);color:var(--accent);margin-left:4px}
.extra{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--f-body);padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
nav{display:grid;grid-template-columns:1fr auto 1.4fr;gap:8px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:10px}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  #panel{border-left:0;border-top:1px solid var(--line);max-height:46vh;max-height:46dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;gap:12px}
  h1{font-size:22px} .note,.sub{display:none} .seg{margin-top:8px} h2{font-size:20px}
  #txt{font-size:15px} #txt.elem{font-size:16px}
}
[hidden]{display:none!important}   /* [FIX 12] .lab/.extra 的 display:flex 會蓋掉 hidden */
.kind{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 8px 0 0;vertical-align:top}
.kind[hidden]{display:none}
.kind a{font:500 13px var(--f-body);padding:6px 14px;color:var(--muted);text-decoration:none}
.kind a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.lab{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.lab-h{font:700 15px var(--f-display)}
.row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.6em;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.row .mini{grid-column:2 / 4}
.row input{width:100%;accent-color:var(--accent)}
.row output{font:13px var(--f-mono);color:var(--ink);text-align:right}
.mini{display:inline-flex;gap:4px}
.mini button{font:14px var(--f-mono);width:36px;height:30px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tip{font-size:12px;color:var(--muted)}
.read{font:13px/1.6 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.state{display:inline-block;font:700 13px var(--f-body);padding:2px 10px;border-radius:999px;background:var(--ok);color:#fff;margin-bottom:4px}
.state.warn{background:#c98a1b}.state.bad{background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="home-link-css">.home-link{display:inline-flex;align-items:center;gap:4px;font:600 13px "Noto Sans TC",system-ui,sans-serif;color:inherit;opacity:.72;text-decoration:none;margin:0 0 6px;padding:4px 10px 4px 8px;border:1px solid currentColor;border-radius:999px;pointer-events:auto;width:max-content}.home-link:hover,.home-link:focus-visible{opacity:1}.home-link[hidden]{display:none!important}</style>

<div id="app">
  <div id="stage">
    <div class="ver">EAGLE 2 v1.1</div>
    <div class="tag pv" id="tagPv" hidden>支點</div>
    <div class="tag cm" id="tagCm" hidden>重心</div>
    <div class="hint">拖曳旋轉 · 滾輪或雙指縮放 · ← → 換步驟</div>
  </div>
  <aside id="panel">
    <header>
      <a class="home-link" href="../index.html" hidden aria-label="回平衡玩具世界首頁">← 平衡玩具首頁</a>
    <div class="eyebrow">雷切木作 · 3mm 板 · 15 片</div>
      <h1>老鷹平衡鳥 第二款</h1>
      <div class="sub">展翅＋爪子版 組裝圖（外形與重心依雷切檔 V2_2 修改版）</div>
      <nav class="kind" id="kind" aria-label="款式" hidden><a href="assembly.html">第一款</a><a href="assembly2.html" aria-current="page">第二款</a><a href="assembly3.html">抓獵物</a></nav>
      <div class="seg" role="group" aria-label="說明程度">
        <button id="lvE" aria-pressed="true">國小版</button><button id="lvJ" aria-pressed="false">國中版</button>
      </div>
    </header>
    <div id="dots" aria-label="步驟"></div>
    <section class="card">
      <div class="num" id="num"></div>
      <h2 id="ttl"></h2>
      <p id="txt"></p>
      <div class="chips" id="chips"></div>
      <div class="extra" id="extra" hidden>
        <button class="btn" id="push">輕推一下</button>
        <button class="btn" id="com" aria-pressed="false">顯示重心</button>
      </div>
      <div class="lab" id="lab" hidden>
        <div class="lab-h">重心實驗：改變羽毛</div>
        <div class="row"><span>左翼羽毛</span><div class="mini" data-side="L"><button>0</button><button>1</button><button>2</button></div></div>
        <div class="row"><span>右翼羽毛</span><div class="mini" data-side="R"><button>0</button><button>1</button><button>2</button></div></div>
        <label class="row" for="angL"><span>左翼角度</span><input type="range" id="angL" min="-60" max="60" step="1" value="0"><output id="angLV">0°</output></label>
        <label class="row" for="angR"><span>右翼角度</span><input type="range" id="angR" min="-60" max="60" step="1" value="0"><output id="angRV">0°</output></label>
        <label class="row" for="hole"><span>插銷孔位</span><input type="range" id="hole" min="-14" max="31" step="1" value="0"><output id="holeV">原位</output></label>
        <div class="row"><span>爪子</span><div class="mini" id="talonSel"><button style="width:auto;padding:0 10px" data-k="perch">垂下</button><button style="width:auto;padding:0 10px" data-k="fly">收起</button><button style="width:auto;padding:0 10px" data-k="none">拿掉</button></div></div>
        <div class="tip">角度往右拉＝羽毛往前（往外）轉，往左拉＝往後（往內）轉。原設計：羽毛朝外、往前約 26°，老鷹水平。</div>
        <div class="read">
          <div class="state" id="state">穩定平衡</div>
          <div id="read1"></div>
          <div id="read2"></div>
        </div>
        <button class="btn" id="reset">恢復原設計</button>
      </div>
    </section>
    <nav>
      <button class="btn" id="prev">上一步</button>
      <button class="btn" id="again" title="重播這一步">重播</button>
      <button class="btn pri" id="next">下一步</button>
    </nav>
    <div class="note">點零件名稱可在畫面中找到它。板上的箭頭形小片本組裝圖未使用。底座、支柱、插銷、墊片和第一款相同。</div>
  </aside>
</div>

  }

}
const COM=new V3();let eqTA=0,eqTB=0,eqA=0,eqB=0,fallen=false;
// [FIX 8] 支點在鳥喙尖。左右方向頭片只有 3 mm 厚，重心偏不到 1.5 mm 不會歪
const HALF=.15;
function updateEq(){
  computeCom(COM);
  const h=-COM.y;
  eqTA=Math.atan2(COM.z,h);      // 正＝低頭（重心偏前）
  const ox=Math.abs(COM.x)<=HALF?0:COM.x-Math.sign(COM.x)*HALF;
  eqTB=Math.atan2(-ox,h);
  fallen=h<.15||Math.abs(eqTA)>.52||Math.abs(eqTB)>.52;
  if(fallen){eqTA=clamp(eqTA*2,-1.15,1.15);eqTB=clamp(eqTB*2,-1.15,1.15)}
  comDot.position.copy(COM);
  readout();
}

function applyPreset(){const c=STEPS[step].cam;want.t.set(c[0],c[1],c[2]);want.yaw=c[3];want.pitch=c[4];want.dist=c[5]*(aspect<.9?1.45:1)}

const $=id=>document.getElementById(id);

function setStep(n){step=clamp(n,0,STEPS.length-1);stepT=0;stepP=0;swingOn=false;swingA=0;selGroup=null;applyPreset();renderUI()}

function readout(){

  $('read2').textContent=fallen?'重心太偏，支點撐不住，鳥會從支柱上翻落':'鳥身：'+(eqTA>=0?'低頭 ':'抬頭 ')+deg(eqTA)+' · '+(Math.abs(eqTB)<.002?'左右水平':(eqTB>=0?'左傾 ':'右傾 ')+deg(eqTB));
  const big=Math.max(Math.abs(eqTA),Math.abs(eqTB))*180/Math.PI;

/* ---------- 相機操作（r128 無 OrbitControls，自寫） ---------- */
const cv=renderer.domElement, ptrs=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;want.yaw-=dx*.006;cam.yaw-=dx*.006;want.pitch=clamp(want.pitch+dy*.005,-.35,1.45);cam.pitch=clamp(cam.pitch+dy*.005,-.35,1.45)}

  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch>0)want.dist=clamp(want.dist*pinch/d,6,120);pinch=d}
});

function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;if(!w||!h)return;aspect=w/h;renderer.setSize(w,h,false);camera.aspect=aspect;camera.updateProjectionMatrix();applyPreset()}
new ResizeObserver(resize).observe(stageEl);

/* ---------- 影格 ---------- */
const tmpM=new M4(),tA=new V3(),tB=new V3(),qA=new Q(),qB=new Q(),sc=new V3(),pos=new V3(),qq=new Q(),eul=new THREE.Euler(),wp=new V3();
function frames(){
  // 支柱：步驟3前懸在底座上方，步驟3落下
  if(step<3)FR.pillar.compose(HOVER,QI,one);
  else if(step===3){pos.lerpVectors(HOVER,STAND,ease(clamp(stepP/.8)));FR.pillar.compose(pos,QI,one)}
  else FR.pillar.compose(STAND,QI,one);
  // 鳥：在工作檯組裝，步驟8移到支柱頂端並擺盪
  if(step<7)FR.bird.compose(BENCH,QI,one);
  else{
    const k=ease(clamp(stepP/.75));pos.lerpVectors(BENCH,TOP,k);pos.y+=Math.sin(Math.PI*k)*4;
    const dec=Math.exp(-.55*swingT), r=Math.min(1,lastDt*2.5);
    eqA+=(eqTA-eqA)*r;eqB+=(eqTB-eqB)*r;
    eul.set(eqA*k+swingA*dec*Math.sin(3.1*swingT),0,eqB*k+swingA*.55*dec*Math.sin(4.0*swingT+.8));
    qq.setFromEuler(eul);FR.bird.compose(pos,qq,one);
  }
}
function target(p){
  tmpM.multiplyMatrices(FR[p.frame],p.local);
  let dim=false,active=false;
  if(step<p.stage){p.flat.decompose(p.tp,p.tq,sc);dim=step>0}
  else if(step>p.stage){tmpM.decompose(p.tp,p.tq,sc)}
  else{
    const k=ease(clamp((stepP-p.delay)/.55));
    p.flat.decompose(tA,qA,sc);tmpM.decompose(tB,qB,sc);
    if(p.app){   // 兩段式：先飛到正上方，再沿槽滑入
      const q=clamp((stepP-p.delay)/p.win);
      if(q<.6){const k1=ease(q/.6);tB.add(p.app);p.tp.lerpVectors(tA,tB,k1);p.tp.y+=Math.sin(Math.PI*k1)*3;p.tq.copy(qA).slerp(qB,k1)}
      else{p.tp.copy(tB).addScaledVector(p.app,1-ease((q-.6)/.4));p.tq.copy(qB)}
    }else{p.tp.lerpVectors(tA,tB,k);p.tp.y+=Math.sin(Math.PI*k)*4;p.tq.copy(qA).slerp(qB,k)}
  }
  active=p.hlAt.includes(step)&&step>0;
  return [dim,active];
}
let lastDt=0;
const clock=new THREE.Clock(), pvTag=$('tagPv'), cmTag=$('tagCm');
function project(v,el){wp.copy(v).project(camera);const vis=wp.z<1;el.hidden=!vis;if(vis){el.style.left=((wp.x+1)/2*stageEl.clientWidth)+'px';el.style.top=((1-wp.y)/2*stageEl.clientHeight)+'px'}}
function animate(){
  requestAnimationFrame(animate);
  let dt=clock.getDelta();if(dt>.1)dt=.1;   // 每幀只取一次
  lastDt=dt;
  const now=clock.elapsedTime;
  stepT+=dt;stepP=Math.min(stepT/DUR,1);
  if(step===7&&stepP>=1){if(!swingOn){swingOn=true;swingA=.2;swingT=0}swingT+=dt}
  if(selGroup){selT+=dt;if(selT>2.2)selGroup=null}
  frames();
  const kp=1-Math.exp(-dt*16);
  for(const p of parts){
    const [dim,active]=target(p);
    p.mesh.position.lerp(p.tp,kp);p.mesh.quaternion.slerp(p.tq,kp);
    p.op+=((dim?.32:1)-p.op)*Math.min(1,dt*8);
    p.face.opacity=p.edge.opacity=p.op;p.face.depthWrite=p.edge.depthWrite=p.op>.95;
    let g=active?.12+.08*Math.sin(now*4):0;
    if(selGroup===p.group)g=.45*(.5+.5*Math.sin(selT*9));
    p.glow+=(g-p.glow)*Math.min(1,dt*10);p.face.emissiveIntensity=p.edge.emissiveIntensity=p.glow;
  }
  // 最後一步淡出板材，畫面接近成品照
  arrowP.material.opacity=sheet.material.opacity;arrowP.visible=sheet.visible;
  const so=sheet.material.opacity+((step===7?0:1)-sheet.material.opacity)*Math.min(1,dt*4);
  sheet.material.opacity=so;sheet.visible=so>.02;sheet.material.depthWrite=so>.95;
  // 重心教具
  rig.matrix.copy(FR.bird);
  const comOn=showCom&&step===7&&stepP>=.8;
  rig.visible=plumb.visible=arrow.visible=comOn;
  if(comOn){comDot.getWorldPosition(arrow.position);project(TOP,pvTag);comDot.getWorldPosition(tA);project(tA,cmTag)}
  else{pvTag.hidden=cmTag.hidden=true}
  // 相機
  const kc=1-Math.exp(-dt*3.5);
  cam.t.lerp(want.t,kc);cam.yaw+=(want.yaw-cam.yaw)*kc;cam.pitch+=(want.pitch-cam.pitch)*kc;cam.dist+=(want.dist-cam.dist)*kc;
  camera.position.set(cam.t.x+cam.dist*Math.sin(cam.yaw)*Math.cos(cam.pitch),cam.t.y+cam.dist*Math.sin(cam.pitch),cam.t.z+cam.dist*Math.cos(cam.yaw)*Math.cos(cam.pitch));
  camera.lookAt(cam.t);
  renderer.render(scene,camera);
}
resize();cam.t.copy(want.t);cam.yaw=want.yaw;cam.pitch=want.pitch+.15;cam.dist=want.dist*1.2;
updateWing();updateEq();renderUI();animate();
})();
